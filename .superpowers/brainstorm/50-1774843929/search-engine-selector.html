<h2>搜索引擎选择器设计方案</h2>
<p class="subtitle">点击搜索框左侧图标时，下拉菜单显示所有搜索引擎选项</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>简洁下拉菜单</h3>
      <p>点击图标后，显示带图标的下拉菜单，每个选项包含搜索引擎图标和名称</p>
    </div>
  </div>
  
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>紧凑下拉菜单</h3>
      <p>只显示图标，点击后展开为图标网格，节省空间</p>
    </div>
  </div>
  
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>浮动面板</h3>
      <p>点击图标后，在搜索框下方显示浮动面板，包含搜索引擎列表和设置</p>
    </div>
  </div>
</div>
