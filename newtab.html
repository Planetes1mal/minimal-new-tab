<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新标签页</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- 时间与日期：位于搜索框上方，时钟是页面最大的文字元素 -->
        <header class="time-block">
            <div id="time" class="time"></div>
            <div id="date" class="date"></div>
        </header>

        <!-- 主搜索区：大尺寸表面，引擎选择在起始端、提交在末尾端 -->
        <form class="search-wrapper" id="search-form" role="search" autocomplete="off">
            <button type="button" class="engine-selector" id="engine-selector" aria-label="切换搜索引擎"
                title="切换搜索引擎">
                <svg id="engine-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"></svg>
            </button>
            <input type="text" id="search-input" placeholder="搜索网络..." autofocus aria-label="搜索内容">
            <button type="submit" id="search-button" class="search-submit" aria-label="搜索">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                        d="M21 21L16.514 16.506L21 21ZM19 10.5C19 15.194 15.194 19 10.5 19C5.806 19 2 15.194 2 10.5C2 5.806 5.806 2 10.5 2C15.194 2 19 5.806 19 10.5Z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </form>

        <!-- 快捷链接启动器：紧邻搜索框下方，横向排列、窄屏自动重排为网格 -->
        <div class="launcher">
            <nav class="quick-links" id="quick-links" aria-label="快捷链接">
                <!-- 快速链接将通过JS动态添加 -->
                <a id="add-link-button" class="quick-link add-link" role="button" tabindex="0"
                    aria-label="添加快捷链接" title="添加快捷链接">
                    <span class="quick-link-icon add-link-button" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round">
                            <path d="M12 5V19M5 12H19"></path>
                        </svg>
                    </span>
                    <span class="quick-link-name">添加</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- 设置按钮 -->
    <button id="settings-btn" class="corner-btn" aria-label="设置" title="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <!-- 主题切换按钮 -->
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题" title="切换主题">
        <svg class="theme-icon sun-icon" width="20" height="20" viewBox="0 0 50 50" fill="none">
            <circle cx="25" cy="25" r="9" stroke="currentColor" stroke-width="2" />
            <line x1="25" y1="45" x2="25" y2="39" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="25" y1="11" x2="25" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="5" y1="25" x2="11" y2="25" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="39" y1="25" x2="45" y2="25" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="10.858" y1="39.143" x2="15.101" y2="34.9" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
            <line x1="34.899" y1="15.102" x2="39.143" y2="10.858" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
            <line x1="10.858" y1="10.858" x2="15.101" y2="15.102" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
            <line x1="34.899" y1="34.9" x2="39.143" y2="39.143" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
        </svg>
        <svg class="theme-icon moon-icon" width="20" height="20" viewBox="0 0 49.739 49.739" fill="currentColor">
            <path
                d="M25.068,48.889c-9.173,0-18.017-5.06-22.396-13.804C-3.373,23.008,1.164,8.467,13.003,1.979l2.061-1.129l-0.615,2.268 c-1.479,5.459-0.899,11.25,1.633,16.306c2.75,5.493,7.476,9.587,13.305,11.526c5.831,1.939,12.065,1.492,17.559-1.258v0 c0.25-0.125,0.492-0.258,0.734-0.391l2.061-1.13l-0.585,2.252c-1.863,6.873-6.577,12.639-12.933,15.822 C32.639,48.039,28.825,48.888,25.068,48.889z M12.002,4.936c-9.413,6.428-12.756,18.837-7.54,29.253 c5.678,11.34,19.522,15.945,30.864,10.268c5.154-2.582,9.136-7.012,11.181-12.357c-5.632,2.427-11.882,2.702-17.752,0.748 c-6.337-2.108-11.473-6.557-14.463-12.528C11.899,15.541,11.11,10.16,12.002,4.936z" />
        </svg>
    </button>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal">
        <div class="modal-content settings-shell">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="close-btn" id="settings-close-btn" aria-label="关闭">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="settings-body">
                <nav class="settings-nav" role="tablist" aria-label="设置分区">
                    <button id="nav-appearance" class="settings-nav-item active" role="tab"
                        aria-selected="true">外观</button>
                    <button id="nav-links" class="settings-nav-item" role="tab"
                        aria-selected="false">快捷链接</button>
                    <button id="nav-backup" class="settings-nav-item" role="tab"
                        aria-selected="false">备份</button>
                    <button id="nav-about" class="settings-nav-item" role="tab"
                        aria-selected="false">关于</button>
                </nav>
                <div class="settings-content">
                    <section id="appearance-section" class="settings-section" role="tabpanel">
                        <h3 class="settings-section-title">外观</h3>
                        <p class="settings-section-desc">配色方案同时作用于浅色与深色模式，不影响快捷链接外观。</p>
                        <div id="scheme-cards" class="scheme-cards" role="radiogroup" aria-label="配色方案">
                            <button type="button" class="scheme-card" data-scheme="forest" role="radio"
                                aria-checked="true">
                                <span class="scheme-swatches" aria-hidden="true">
                                    <span class="swatch-row swatch-light"><i></i><i></i><i></i></span>
                                    <span class="swatch-row swatch-dark"><i></i><i></i><i></i></span>
                                </span>
                                <span class="scheme-card-name">森绿</span>
                                <span class="scheme-badge">默认</span>
                                <svg class="scheme-check" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M3.5 8.5L6.5 11.5L12.5 4.5" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <button type="button" class="scheme-card" data-scheme="ocean" role="radio"
                                aria-checked="false">
                                <span class="scheme-swatches" aria-hidden="true">
                                    <span class="swatch-row swatch-light"><i></i><i></i><i></i></span>
                                    <span class="swatch-row swatch-dark"><i></i><i></i><i></i></span>
                                </span>
                                <span class="scheme-card-name">碧蓝</span>
                                <svg class="scheme-check" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M3.5 8.5L6.5 11.5L12.5 4.5" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <button type="button" class="scheme-card" data-scheme="amber" role="radio"
                                aria-checked="false">
                                <span class="scheme-swatches" aria-hidden="true">
                                    <span class="swatch-row swatch-light"><i></i><i></i><i></i></span>
                                    <span class="swatch-row swatch-dark"><i></i><i></i><i></i></span>
                                </span>
                                <span class="scheme-card-name">琥珀</span>
                                <svg class="scheme-check" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M3.5 8.5L6.5 11.5L12.5 4.5" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <button type="button" class="scheme-card" data-scheme="slate" role="radio"
                                aria-checked="false">
                                <span class="scheme-swatches" aria-hidden="true">
                                    <span class="swatch-row swatch-light"><i></i><i></i><i></i></span>
                                    <span class="swatch-row swatch-dark"><i></i><i></i><i></i></span>
                                </span>
                                <span class="scheme-card-name">岩墨</span>
                                <svg class="scheme-check" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M3.5 8.5L6.5 11.5L12.5 4.5" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                        <h4 class="settings-sub-title">时间格式</h4>
                        <div class="segmented-control">
                            <label class="segment-option">
                                <input type="radio" name="hour-format" id="hour-format-24" value="24" checked>
                                <span class="segment-label">24 小时</span>
                            </label>
                            <label class="segment-option">
                                <input type="radio" name="hour-format" id="hour-format-12" value="12">
                                <span class="segment-label">12 小时</span>
                            </label>
                        </div>
                    </section>

                    <section id="links-section" class="settings-section" role="tabpanel" hidden>
                        <h3 class="settings-section-title">快捷链接</h3>
                        <p class="settings-section-desc">管理启动器中的快捷链接，拖拽行调整顺序。</p>
                        <button id="settings-add-link" class="btn btn-primary settings-add-link">＋ 添加快捷链接</button>
                        <div id="settings-link-list" class="settings-link-list"></div>
                    </section>

                    <section id="backup-section" class="settings-section" role="tabpanel" hidden>
                        <h3 class="settings-section-title">备份</h3>
                        <p class="settings-section-desc">将快捷链接导出为 JSON 或从 JSON 导入。</p>
                        <div id="export-panel" class="settings-panel">
                            <p id="export-hint" class="panel-hint">将快捷链接导出为 JSON</p>
                            <div class="modal-row">
                                <button id="export-clipboard-btn" class="btn btn-primary">复制到剪贴板</button>
                                <button id="export-file-btn" class="btn btn-secondary">导出到文件</button>
                            </div>
                        </div>
                        <div id="import-section" class="settings-panel">
                            <label class="settings-field-label" for="import-json">粘贴 JSON 数据</label>
                            <textarea id="import-json" placeholder='{"version":1,"links":[...]}' rows="4"></textarea>
                            <div class="import-divider">或</div>
                            <label for="import-file" class="btn import-file-btn">选择文件</label>
                            <input type="file" id="import-file" accept=".json" class="sr-only">
                        </div>
                        <div id="import-message" class="import-message" style="display: none;"></div>
                    </section>

                    <section id="about-section" class="settings-section" role="tabpanel" hidden>
                        <h3 class="settings-section-title">关于</h3>
                        <div class="about-card">
                            <p class="about-name">极简新标签页 <span id="about-version" class="about-version"></span></p>
                            <p class="about-license">MIT License · 一个极简的新标签页扩展</p>
                            <a class="about-link" href="https://github.com/Planetes1mal/minimal-new-tab"
                                target="_blank" rel="noopener noreferrer">GitHub ↗</a>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <div id="add-link-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>快速链接</h2>
                <button class="close-btn" aria-label="关闭">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <form class="modal-form">
                <div class="form-group">
                    <label for="link-name">名称</label>
                    <input type="text" id="link-name" placeholder="输入网站名称">
                </div>

                <div class="form-group">
                    <label for="link-url">网址</label>
                    <input type="url" id="link-url" placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label>图标样式</label>
                    <div class="segmented-control">
                        <label class="segment-option">
                            <input type="radio" name="icon-mode" id="icon-letter" value="letter">
                            <span class="segment-label">极简生成</span>
                        </label>
                        <label class="segment-option">
                            <input type="radio" name="icon-mode" id="icon-favicon" value="favicon" checked>
                            <span class="segment-label">网站默认</span>
                        </label>
                        <label class="segment-option">
                            <input type="radio" name="icon-mode" id="icon-custom" value="custom">
                            <span class="segment-label">指定 URL</span>
                        </label>
                    </div>

                    <div class="custom-url-input" id="custom-url-container">
                        <input type="url" id="icon-custom-url" placeholder="https://example.com/favicon.ico">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-link">取消</button>
                    <button type="button" class="btn btn-primary" id="save-link">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
